# Telegram Mini App (CRM) — nginx config example.
#
# Place this in /etc/nginx/sites-available/ and symlink to sites-enabled.
# Replace DOMAIN and BOT_TOKEN. The bot listens on :8081 and the API on :8080.

server {
    listen 80;
    server_name DOMAIN;  # e.g. app.example.com

    # Let's Encrypt HTTP challenge
    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name DOMAIN;

    ssl_certificate     /etc/letsencrypt/live/DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/DOMAIN/privkey.pem;

    # Static Mini App (built into web/dist)
    root /var/www/trenerbot/web/dist;
    index index.html;

    location / {
        try_files $uri /index.html;  # SPA fallback for client-side routing
    }

    # CRM API -> Go server (:8080)
    location /api/ {
        proxy_pass http://127.0.0.1:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Telegram webhook -> bot (:8081). BOT_TOKEN is the secret path segment.
    location /BOT_TOKEN/ {
        proxy_pass http://127.0.0.1:8081/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
